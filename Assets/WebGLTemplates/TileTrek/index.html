<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* the game always fills its frame: landscape on desktop, portrait or landscape on phones */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1433; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #1e1433; outline: none; touch-action: none; }
      #loader { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(64vw, 380px);
                text-align: center; font-family: "Trebuchet MS", Arial, sans-serif; color: #ffd64a; }
      #loader .title { font-size: 30px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 3px 0 #3a1e46; }
      #bar { height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.15); overflow: hidden; margin-top: 14px; }
      #fill { height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #9bea5e, #ffd64a); transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader"><div class="title">{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div></div>
    <script>
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // crisp but affordable on high-DPI phones
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var canvas = document.querySelector("#unity-canvas");
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.getElementById("loader").style.display = "none";
        }).catch(function (message) {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
